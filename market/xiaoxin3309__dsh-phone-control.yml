url: https://github.com/xiaoxin3309/dsh-phone-control
name: xiaoxin3309/dsh-phone-control
category: remote
description:
  en: Control a paired Android phone from DeepSeek Harness — read the accessibility node tree, tap by text, type into fields, take screenshots, launch apps, and read or write files over an encrypted WebSocket. Pair by 8-digit code or by scanning the QR code in the settings page, which also manages the port and the app's permission switches.
  zh: 从 DeepSeek Harness 控制已配对的 Android 手机：读取无障碍节点树、按文字点击、输入文字、截图、启动应用，还能读写手机上的文件；连接走加密 WebSocket。配对可以填 8 位配对码，也可以直接扫设置页里的二维码，端口和 App 的权限开关也在这里管。
icon: https://raw.githubusercontent.com/xiaoxin3309/dsh-phone-control/main/assets/icon-180.png